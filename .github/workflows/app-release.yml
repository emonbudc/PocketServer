name: App release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v1.0.0.1

permissions:
  contents: write

concurrency:
  group: app-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          if ! command -v sdkmanager > /dev/null; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Assemble APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare release files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PocketServer-${TAG}-arm64-debug.apk"
          cd dist
          sha256sum "PocketServer-${TAG}-arm64-debug.apk" | tee "PocketServer-${TAG}-sha256.txt"
          cat > notes.md <<NOTES
          PocketServer ${TAG}

          - Standalone ARM64 Android app for PHP, Nginx, Apache and MariaDB.
          - First launch downloads SHA-256 verified runtime bundles from the published catalog.
          - This APK is debug-signed for sideloading; it is not Play Store signed.
          - Runtime services still require matching configuration files.
          NOTES

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketServer-${{ inputs.tag }}-arm64-debug
          path: dist/
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "PocketServer $TAG" \
              --notes-file dist/notes.md \
              --latest
          fi
          gh release upload "$TAG" \
            "dist/PocketServer-${TAG}-arm64-debug.apk" \
            "dist/PocketServer-${TAG}-sha256.txt" \
            --clobber
