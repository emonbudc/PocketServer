name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          if ! command -v sdkmanager > /dev/null; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Checksums
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee app-debug-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketServer-debug-arm64-v8a
          path: |
            app/build/outputs/apk/debug/*.apk
            app-debug-sha256.txt
          if-no-files-found: error
          retention-days: 30
