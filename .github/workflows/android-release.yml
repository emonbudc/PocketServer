name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - name: Check secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETSERVER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POCKETSERVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETSERVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POCKETSERVER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured; signed release job skipped."
          fi

  release:
    name: Build signed release APK
    needs: preflight
    if: needs.preflight.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          if ! command -v sdkmanager > /dev/null; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETSERVER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POCKETSERVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETSERVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POCKETSERVER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing POCKETSERVER_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing POCKETSERVER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing POCKETSERVER_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing POCKETSERVER_KEY_PASSWORD"; exit 1; }

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETSERVER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketserver-release.keystore"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Assemble signed release APK
        env:
          POCKETSERVER_KEYSTORE_FILE: ${{ runner.temp }}/pocketserver-release.keystore
          POCKETSERVER_KEYSTORE_PASSWORD: ${{ secrets.POCKETSERVER_KEYSTORE_PASSWORD }}
          POCKETSERVER_KEY_ALIAS: ${{ secrets.POCKETSERVER_KEY_ALIAS }}
          POCKETSERVER_KEY_PASSWORD: ${{ secrets.POCKETSERVER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        run: apksigner verify --verbose --print-certs app/build/outputs/apk/release/*.apk

      - name: Checksums
        run: sha256sum app/build/outputs/apk/release/*.apk | tee app-release-sha256.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketServer-release-arm64-v8a
          path: |
            app/build/outputs/apk/release/*.apk
            app-release-sha256.txt
          if-no-files-found: error
          retention-days: 90
